<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de imágenes personalizadas V4.0</title>
    <meta
      name="description"
      content="Aplicación web móvil para generar y compartir imágenes personalizadas en PNG de 1080 × 1080 píxeles con procesamiento local en el dispositivo."
    />
    <meta property="og:title" content="Generador de imágenes personalizadas V4.0" />
    <meta
      property="og:description"
      content="Aplicación web móvil para generar y compartir imágenes personalizadas en PNG de 1080 × 1080 píxeles con procesamiento local en el dispositivo."
    />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Generador fotográfico V4.1</h1>

      <section class="preview-panel" aria-label="Vista previa">
        <canvas
          id="c"
          width="1080"
          height="1080"
          aria-label="Vista previa de la imagen personalizada"
        ></canvas>
      </section>

      <section class="controls-panel" aria-label="Controles de personalización">
        <div class="field">
          <label for="photo">Fotografía obligatoria</label>
          <input id="photo" type="file" accept="image/*" required />
        </div>

        <div class="field">
          <label for="name">Nombre obligatorio</label>
          <input
            id="name"
            type="text"
            maxlength="100"
            placeholder="Escribe tu nombre"
            autocomplete="name"
            required
          />
        </div>

        <div class="field">
          <div class="field-header">
            <label for="zoom">Tamaño de fotografía</label>
            <span id="zoom-value" class="zoom-value">1.00×</span>
          </div>
          <input id="zoom" type="range" min="1" max="4" step="0.01" value="1" />
          <small class="hint">Arrastra la fotografía para ajustar su posición.</small>
        </div>

        <button id="reset" type="button" class="btn btn-secondary" disabled>
          Restablecer fotografía
        </button>

        <div class="actions">
          <button id="save" type="button" class="btn btn-primary" disabled>
            Descargar PNG
          </button>
          <button id="share" type="button" class="btn btn-outline" disabled>
            Compartir
          </button>
        </div>

        <small id="status" class="status" role="status" aria-live="polite"></small>
        <small class="privacy">La fotografía se procesa en este dispositivo.</small>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
